services:
  postgres:
    image: postgres:16-alpine
    container_name: wa-ai-sales-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: whatsapp_ai_sales_v1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whatsapp_ai_sales_v1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
